description = "High-level, safe, ergonomic Rust runtime API for by-lite wrapping WPE WebKit 2.0"
license = "MIT OR Apache-2.0"

[dependencies]
by-lite-sys = { path = "../by-lite-sys" }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
