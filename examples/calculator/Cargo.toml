[package]
name = "calculator-example"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight desktop calculator example built on by-lite"
license = "MIT OR Apache-2.0"

[[bin]]
name = "calculator"
path = "src/main.rs"

[dependencies]
by-lite-core = { path = "../../crates/by-lite-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
